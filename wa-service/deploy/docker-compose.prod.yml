# Server (Oracle / any VPS): wa-service behind Caddy, which gets and renews the HTTPS certificate itself.
# Started by setup.sh:  docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  wa-service:
    build: ..
    restart: always
    env_file: ../.env
    ports:
      # Only for checks from the server itself; the internet reaches it through Caddy
      - "127.0.0.1:8080:8080"
    volumes:
      # WhatsApp session + message queue: kept across restarts and updates
      - wa-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.8.4-alpine
    restart: always
    depends_on:
      - wa-service
    environment:
      # e.g. 141.148.10.20.sslip.io or wa.yourdomain.com (written to deploy/.domain by setup.sh)
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wa-data:
  caddy-data:
  caddy-config:
